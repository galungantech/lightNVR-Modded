name: Auto-Update go2rtc Submodule

on:
  schedule:
    # Otomatis berjalan setiap hari jam 00:00 UTC (bisa disesuaikan)
    - cron: '0 0 * * *'
  workflow_dispatch: # Bisa dijalankan manual lewat tab Actions di GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update go2rtc submodule to master
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Paksa update dan izinkan penggabungan riwayat yang berbeda (unrelated histories)
          git submodule update --remote --merge --force go2rtc || true
          
          # Masuk ke direktori submodule untuk memastikan posisinya di master
          cd go2rtc
          git checkout master || true
          git pull origin master --allow-unrelated-histories || true
          cd ..
          
          # Cek apakah ada perubahan untuk di-commit
          if git diff --quiet; then
            echo "No changes in go2rtc submodule."
          else
            git add go2rtc
            git commit -m "chore(go2rtc): automated update to latest master (allow unrelated histories)"
            git push
          fi
