name: Sync Fork Final

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch tujuan"
        required: true
        type: choice
        options:
          - sync-main
        default: sync-main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/galungantech/lightNVR.git
          git fetch upstream --tags
          git fetch origin

      - name: Check updates
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/lightnvr)
          echo "LOCAL=$LOCAL"
          echo "UPSTREAM=$UPSTREAM"
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync with upstream
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git checkout ${{ github.event.inputs.target_branch }}
          git reset --hard upstream/0.43.3

      - name: Push changes
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git push origin HEAD:${{ github.event.inputs.target_branch }} --force
